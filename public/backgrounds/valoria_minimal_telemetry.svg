    <radialGradient id="baseRadial" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="60%" stop-color="#06080d" />
      <stop offset="100%" stop-color="#030408" />
    </radialGradient>

    <!-- Ambient Cyan Glow (Top-Left) -->
